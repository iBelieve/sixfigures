name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Cancel a pull request run when a newer commit supersedes it.
# Pushes to master keep running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build
